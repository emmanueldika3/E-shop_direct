<div class="group relative bg-white border border-gray-200 rounded-2xl p-4 transition-all hover:shadow-xl hover:-translate-y-1">
  
  <div class="aspect-square w-full overflow-hidden rounded-xl bg-gray-100 mb-4">
    <img [src]="product.image" [alt]="product.name" 
         class="h-full w-full object-cover object-center group-hover:scale-110 transition-transform duration-300">
  </div>

  <div class="space-y-1">
    <h3 class="text-sm font-bold text-gray-900 truncate uppercase tracking-tight">
      {{ product.name }}
    </h3>
    <p class="text-xs text-gray-500 line-clamp-2 h-8">
      {{ product.description }}
    </p>
  </div>

  <div class="mt-4 flex items-center justify-between">
    <span class="text-lg font-black text-indigo-600">
      {{ product.price }} FCFA
    </span>
    
    <button 
    (click)="ajouter()" 
    class="w-fit bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-1 rounded-lg transition active:scale-95 cursor-pointer transition-all duration-300 hover:scale-110 active:scale-95 text-xs">
    Ajouter au panier 🛒
  </button>
  </div>

  <span class="absolute top-6 left-6 bg-white/90 backdrop-blur-sm text-[10px] font-black px-2 py-1 rounded-md shadow-sm uppercase">
    New
  </span>
 <div class="flex flex-col">
    <ng-container *ngIf="product.discountPrice">
      <span class="text-lg font-black text-red-600">
        {{ product.discountPrice | number }} FCFA
      </span>
      <span class="text-xs text-gray-400 line-through">
        {{ product.price | number }} FCFA
      </span>
    </ng-container>

    
  </div>
</div>
