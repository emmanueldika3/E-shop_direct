<div
  class="w-75 rounded-lg shadow-xl overflow-hidden "
  [class.bg-gray-300]="even"
  [class.bg-gray-100]="odd"
>
  <img [src]="product.image" [alt]="product.name" width="100%" class="object-cover h-50" />
  <div class="p-2 flex flex-col gap-2">
    <h4>{{ product.name }}</h4>
    <p>{{ product.price }}</p>
    <p>{{ product.description.substring(0, 50) }}...</p>
  </div>
</div>
