<div class="min-h-screen flex items-center justify-center bg-[#f8fafc] relative overflow-hidden px-6">
  
  <!-- Décor d'arrière-plan dynamique (E-commerce Style) -->
  <div class="absolute top-0 left-0 w-full h-full opacity-40 z-0" 
       style="background-image: linear-gradient(#e2e8f0 1.5px, transparent 1.5px), linear-gradient(90deg, #e2e8f0 1.5px, transparent 1.5px); background-size: 60px 60px;">
  </div>
  
  <!-- logo de shopping -->
  <div class="absolute -top-24 -right-24 w-96 h-96 bg-indigo-200/50 rounded-full blur-[100px] animate-pulse"></div>
  <div class="absolute -bottom-24 -left-24 w-96 h-96 bg-blue-200/50 rounded-full blur-[100px]"></div>

  <div class="max-w-md w-full bg-white rounded-[2.5rem] p-10 md:p-14 shadow-[0_40px_80px_-15px_rgba(15,23,42,0.1)] relative z-10 border border-slate-100">
    
    <!-- Branding e-shop direct -->
    <div class="text-center mb-12">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-slate-900 shadow-xl mb-6">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
        </svg>
      </div>
      <h2 class="text-4xl font-black text-slate-900 tracking-tighter">E-Shop <span class="text-indigo-500 italic">Direct</span></h2>
      <p class="text-slate-400 mt-2 font-medium">Heureux de vous revoir !</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="space-y-2">
        <label class="ml-4 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Votre Email</label>
        <input type="email" name="email" [(ngModel)]="loginData.email" required
               placeholder="client@eshop.com"
               class="w-full px-8 py-5 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500 transition-all outline-none text-slate-900 font-semibold">
      </div>

      <div class="space-y-2">
        <div class="flex justify-between px-4">
          <label class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Mot de passe</label>
        </div>
        <input type="password" name="password" [(ngModel)]="loginData.password" required
               placeholder="••••••••"
               class="w-full px-8 py-5 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500 transition-all outline-none text-slate-900 font-semibold">
      </div>

      <button type="submit" 
              class="w-full py-5 bg-slate-900 text-white rounded-2xl font-bold hover:bg-indigo-600 transition-all shadow-2xl shadow-orange-100 active:scale-95 text-lg">
        Se connecter
      </button>
    </form>

    <div class="mt-10 text-center">
      <p class="text-slate-400 text-sm">
        Pas de compte ? 
        <a href="/register" class="text-indigo-600 font-black hover:underline ml-1">Rejoignez-nous</a>
      </p>
    </div>
  </div>
</div>
