<div class="relative group"> <!-- 'group' pour détecter le survol et afficher le dropdown -->
  
  <!-- Bouton Panier avec Badge -->
  <button class="relative p-2 hover:bg-gray-100 rounded-full transition cursor-pointer">
    <span class="text-xl">🛒</span>
    @if (cartCount() > 0) {
      <span class="absolute top-0 right-0 bg-red-600 text-white text-[9px] font-black px-1.5 py-0.5 rounded-full border-2 border-white">
        {{ cartCount() }}
      </span>
    }
  </button>

  <!-- LISTE DÉROULANTE (DROPDOWN) -->
  <div class="absolute right-0 mt-2 w-64 bg-white border border-gray-200 rounded-xl shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50">
    <div class="p-4">
      <h3 class="text-sm font-bold border-b pb-2 mb-2">Mon Panier</h3>
      
      <div class="max-h-60 overflow-y-auto">
        <!-- UNE SEULE BOUCLE ICI -->
        @for (item of items(); track item.id) {
          <div class="flex items-center gap-3 py-2 border-b border-gray-50 last:border-0 group/item">
            <img [src]="item.image" class="w-10 h-10 object-cover rounded shadow-sm">
            
            <div class="flex-1">
              <p class="text-xs font-semibold truncate">{{ item.name }}</p>
              <p class="text-xs text-indigo-600 font-medium">
                {{ item.price }} FCFA <span class="text-gray-400 ml-1 text-[10px]">x{{ item.quantity }}</span>
              </p>
            </div>

            <!-- BOUTON SUPPRIMER (POUBELLE) -->
            <button 
              (click)="retirer(item.id)" 
              class="group/trash p-2 transition-colors"
              title="Retirer du panier">
              <svg 
                xmlns="http://www.w3.org/2000/svg" 
                class="w-4 h-4 text-gray-300 group-hover/trash:text-red-600 transition-colors" 
                fill="none" 
                viewBox="0 0 24 24" 
                stroke="currentColor">
                <path 
                  stroke-linecap="round" 
                  stroke-linejoin="round" 
                  stroke-width="2" 
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        } @empty {
          <div class="py-6 text-center">
            <p class="text-gray-500 text-xs">Votre panier est vide 📭</p>
          </div>
        }
      </div>

      <!-- Bouton Commander - S'affiche uniquement si le panier n'est pas vide -->
     @if (items().length > 0) {
  <button 
    (click)="commander()" 
    class="w-full mt-3 bg-indigo-600 text-white py-2 rounded-lg text-xs font-bold hover:bg-indigo-700 transition active:scale-95">
    Commander
  </button>
      }
    </div>
  </div>
</div>
