<div class="p-8 bg-gray-300 mx-auto px-4 py-8 min-h-screen">
   <header class="mb-12 flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-gray-200 pb-6">
    <div>
      <h1 class="text-4xl font-black text-gray-900 uppercase tracking-tighter italic">
        Rayon <span class="text-indigo-600">Smartphones</span>
      </h1>
      <p class="text-gray-500 font-medium mt-1">
        Découvrez les dernières pépites technologiques.
      </p>
    </div>

    <div class="flex items-center">
      <span class="flex items-center gap-2 bg-gray-900 text-white text-xs font-black px-4 py-2 rounded-lg tracking-widest uppercase">
        <span class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></span>
        {{ products.length }} Articles disponibles
      </span>
    </div>
  </header>
  
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
    <app-product-card 
      *ngFor="let phone of products" 
      [product]="phone">
    </app-product-card>
  </div>
</div>
