<div class="p-8 bg-gray-300 mx-auto px-4 py-8 min-h-screen">
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-black text-gray-900 uppercase tracking-tighter">
        Rayon <span class="text-indigo-600">Informatique</span>
      </h1>
      <p class="text-sm text-gray-500 font-medium">Ordinateurs, composants et périphériques pro.</p>
    </div>
    
    <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full">
      {{ products.length }} Articles
    </span>
  </div>
  
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
    <app-product-card 
      *ngFor="let item of products" 
      [product]="item">
    </app-product-card>
  </div>
</div>
